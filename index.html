<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Inmuno TD</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #3a2a2a;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Shown until the game boots, so a slow connection never sees a blank screen. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ddbdb8;
        color: #3a2a2a;
        font: bold 28px sans-serif;
        animation: boot-pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes boot-pulse {
        from { opacity: 0.45; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">Cargando…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
