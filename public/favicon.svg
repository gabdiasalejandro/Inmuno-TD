<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- background: game floor tone so the cell reads on light and dark tabs -->
  <rect width="64" height="64" rx="14" fill="#DDBDB8"/>
  <!-- body: leukocyte, pale bone with thick dark-brown outline -->
  <circle cx="32" cy="33" r="20" fill="#FBF7F2" stroke="#3A2A2A" stroke-width="5"/>
  <!-- multilobed nucleus (simplified) -->
  <g fill="#7B4FA3" stroke="#3A2A2A" stroke-width="2.5" stroke-linejoin="round">
    <ellipse cx="25" cy="43" rx="6" ry="5"/>
    <ellipse cx="37" cy="46" rx="6" ry="5"/>
    <ellipse cx="40" cy="37" rx="5" ry="4.5"/>
  </g>
  <!-- eyes with glints -->
  <ellipse cx="24" cy="26" rx="3.6" ry="4.6" fill="#3A2A2A"/>
  <ellipse cx="40" cy="26" rx="3.6" ry="4.6" fill="#3A2A2A"/>
  <circle cx="23" cy="24.5" r="1.3" fill="#FBF7F2"/>
  <circle cx="39" cy="24.5" r="1.3" fill="#FBF7F2"/>
</svg>
