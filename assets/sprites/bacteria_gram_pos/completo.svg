<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g id="brazos" fill="none" stroke="#3A2A2A" stroke-linejoin="round" stroke-linecap="round" stroke-width="7">
    <!-- flagelos inferiores: hacen de patitas -->
    <path d="M 84 174 Q 74 186 82 196 Q 90 206 78 218"/>
    <path d="M 114 176 Q 104 188 112 198 Q 120 208 108 220"/>
    <path d="M 144 176 Q 134 188 142 198 Q 150 208 138 220"/>
    <path d="M 172 172 Q 162 186 170 196 Q 178 206 166 218"/>
    <!-- flagelo trasero: cola que se agita -->
    <path d="M 200 132 Q 212 118 224 128 Q 234 138 240 126"/>
  </g>
  <g id="cuerpo" stroke-linejoin="round" stroke-linecap="round">
    <!-- bacilo: capsula horizontal, la cara va en el extremo izquierdo -->
    <path fill="#7452E0" d="M 90 104 H 166 A 38 38 0 0 1 166 180 H 90 A 38 38 0 0 1 90 104 Z"/>
    <!-- sombra (cel shading) inferior -->
    <path fill="#5435B8" d="M 203 150 A 38 38 0 0 1 166 180 H 90 A 38 38 0 0 1 55.5 158 Q 120 172 203 150 Z"/>
    <!-- pared gruesa de peptidoglucano: linea interior en la mitad trasera -->
    <path fill="none" stroke="#4A2FA6" stroke-width="4" d="M 128 114 H 166 A 28 28 0 0 1 192 152"/>
    <!-- brillo -->
    <path fill="#9E86F2" d="M 96 112 Q 128 108 150 111 Q 146 117 100 118 Q 92 118 96 112 Z"/>
    <!-- contorno -->
    <path fill="none" stroke="#3A2A2A" stroke-width="8" d="M 90 104 H 166 A 38 38 0 0 1 166 180 H 90 A 38 38 0 0 1 90 104 Z"/>
    <!-- emblema PAMP: rombo con halo claro y rombo interior, reutilizable en otros patogenos -->
    <polygon points="167,114 187,134 167,154 147,134" fill="#8E2C6B" stroke="#F6E9EF" stroke-width="14"/>
    <polygon points="167,114 187,134 167,154 147,134" fill="#8E2C6B" stroke="#3A2A2A" stroke-width="5"/>
    <polygon points="167,126 175,134 167,142 159,134" fill="#F6E9EF"/>
  </g>
  <g id="ojos" stroke-linejoin="round" stroke-linecap="round">
    <!-- ojo izquierdo (delantero): base compartida -->
    <ellipse cx="80" cy="136" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="77" cy="132" r="4.5" fill="#FBF7F2"/>
    <circle cx="83.5" cy="141" r="2" fill="#FBF7F2"/>
    <!-- ojo derecho: base compartida -->
    <ellipse cx="114" cy="136" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="111" cy="132" r="4.5" fill="#FBF7F2"/>
    <circle cx="117.5" cy="141" r="2" fill="#FBF7F2"/>
    <!-- parpados inclinados hacia el centro: mirada traviesa -->
    <path fill="#7452E0" d="M 67 120 H 93 V 134 L 67 128 Z"/>
    <path fill="#7452E0" d="M 101 120 H 127 V 128 L 101 134 Z"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 68 128 L 92 134 M 102 134 L 126 128"/>
    <!-- cejas asimetricas: una alzada, otra fruncida -->
    <path fill="none" stroke="#3A2A2A" stroke-width="6" d="M 66 116 Q 76 108 90 115 M 102 122 L 124 114"/>
    <!-- boca: sonrisa ladeada con un colmillo -->
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 76 158 Q 94 168 110 155"/>
    <path fill="#FBF7F2" stroke="#3A2A2A" stroke-width="3" d="M 89 162 L 93 171 L 98 163 Z"/>
  </g>
</svg>
