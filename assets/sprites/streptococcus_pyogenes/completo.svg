<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g id="brazos" fill="none" stroke="#3A2A2A" stroke-linejoin="round" stroke-linecap="round" stroke-width="7">
    <!-- patitas cortas y rectas: el estreptococo no tiene flagelos, asi que no son onduladas -->
    <path d="M 70 170 L 64 196 L 56 214"/>
    <path d="M 104 172 L 106 198 L 100 216"/>
    <path d="M 140 172 L 138 198 L 132 216"/>
    <path d="M 166 172 L 168 198 L 162 216"/>
    <path d="M 204 176 L 208 198 L 202 216"/>
  </g>
  <g id="cuerpo" stroke-linejoin="round" stroke-linecap="round">
    <!-- cadena de cocos (estreptococo): de la cola a la cabeza, cada coco tapa al anterior; el contorno marca los tabiques -->
    <circle cx="206" cy="154" r="24" fill="#E04A5A"/>
    <path fill="#B32F45" d="M 182 154 A 24 24 0 0 0 230 154 Q 206 166 182 154 Z"/>
    <path fill="#F28A93" d="M 191 144 Q 201 135 213 137 Q 204 141 194 147 Q 190 147 191 144 Z"/>
    <circle cx="206" cy="154" r="24" fill="none" stroke="#3A2A2A" stroke-width="8"/>
    <circle cx="152" cy="148" r="30" fill="#E04A5A"/>
    <path fill="#B32F45" d="M 122 148 A 30 30 0 0 0 182 148 Q 152 163 122 148 Z"/>
    <path fill="#F28A93" d="M 133 135 Q 146 124 161 127 Q 149 132 137 140 Q 132 139 133 135 Z"/>
    <circle cx="152" cy="148" r="30" fill="none" stroke="#3A2A2A" stroke-width="8"/>
    <circle cx="88" cy="140" r="36" fill="#E04A5A"/>
    <path fill="#B32F45" d="M 52 140 A 36 36 0 0 0 124 140 Q 88 158 52 140 Z"/>
    <path fill="#F28A93" d="M 66 125 Q 81 111 99 115 Q 84 120 70 130 Q 64 129 66 125 Z"/>
    <circle cx="88" cy="140" r="36" fill="none" stroke="#3A2A2A" stroke-width="8"/>
    <!-- pared gruesa de peptidoglucano (grampositiva): linea interior en la cola -->
    <path fill="none" stroke="#962638" stroke-width="4" d="M 200 136 A 18 18 0 0 1 222 158"/>
    <!-- emblema PAMP en el coco central, mitad trasera del cuerpo -->
    <polygon points="152,128 172,148 152,168 132,148" fill="#8E2C6B" stroke="#F6E9EF" stroke-width="14"/>
    <polygon points="152,128 172,148 152,168 132,148" fill="#8E2C6B" stroke="#3A2A2A" stroke-width="5"/>
    <polygon points="152,140 160,148 152,156 144,148" fill="#F6E9EF"/>
  </g>
  <g id="ojos" stroke-linejoin="round" stroke-linecap="round">
    <!-- ojo izquierdo (delantero): base compartida -->
    <ellipse cx="72" cy="134" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="69" cy="130" r="4.5" fill="#FBF7F2"/>
    <circle cx="75.5" cy="139" r="2" fill="#FBF7F2"/>
    <!-- ojo derecho: base compartida -->
    <ellipse cx="106" cy="134" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="103" cy="130" r="4.5" fill="#FBF7F2"/>
    <circle cx="109.5" cy="139" r="2" fill="#FBF7F2"/>
    <!-- parpados inclinados hacia el centro: mirada maliciosa -->
    <path fill="#E04A5A" d="M 59 118 H 85 V 132 L 59 126 Z"/>
    <path fill="#E04A5A" d="M 93 118 H 119 V 126 L 93 132 Z"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 60 126 L 84 132 M 94 132 L 118 126"/>
    <!-- cejas asimetricas, las dos fruncidas hacia el centro: escurridizo y con prisa -->
    <path fill="none" stroke="#3A2A2A" stroke-width="6" d="M 58 112 Q 70 104 84 113 M 94 120 L 118 110"/>
    <!-- boca: sonrisa ladeada con colmillo -->
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 70 156 Q 88 166 104 153"/>
    <path fill="#FBF7F2" stroke="#3A2A2A" stroke-width="3" d="M 83 160 L 87 169 L 92 161 Z"/>
  </g>
</svg>
