    <path fill="#B32F45" d="M 182 154 A 24 24 0 0 0 230 154 Q 206 166 182 154 Z"/>
    <path fill="#F28A93" d="M 191 144 Q 201 135 213 137 Q 204 141 194 147 Q 190 147 191 144 Z"/>
