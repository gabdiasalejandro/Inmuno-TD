    <circle cx="152" cy="148" r="30" fill="#E04A5A"/>
    <path fill="#B32F45" d="M 122 148 A 30 30 0 0 0 182 148 Q 152 163 122 148 Z"/>
    <path fill="#F28A93" d="M 133 135 Q 146 124 161 127 Q 149 132 137 140 Q 132 139 133 135 Z"/>
    <circle cx="152" cy="148" r="30" fill="none" stroke="#3A2A2A" stroke-width="8"/>
    <circle cx="88" cy="140" r="36" fill="#E04A5A"/>
    <path fill="#B32F45" d="M 52 140 A 36 36 0 0 0 124 140 Q 88 158 52 140 Z"/>
    <path fill="#F28A93" d="M 66 125 Q 81 111 99 115 Q 84 120 70 130 Q 64 129 66 125 Z"/>
