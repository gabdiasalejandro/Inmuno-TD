<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g id="brazos" stroke-linejoin="round" stroke-linecap="round">
    <!-- pseudopodo delantero alto: se estira hacia adelante y termina en dedos romos -->
    <path fill="#FBF7F2" stroke="#3A2A2A" stroke-width="8" d="M 196 86 C 206 78 214 66 220 56 C 226 48 238 52 234 62 C 240 64 240 76 232 78 C 236 84 232 94 224 92 C 218 100 212 112 206 122 Z"/>
    <path fill="#E1D9E8" d="M 232 78 C 236 84 232 94 224 92 C 218 100 214 106 210 112 C 212 100 218 88 226 82 C 228 80 230 79 232 78 Z"/>
    <!-- pseudopodo delantero bajo: se arrastra por el suelo hacia adelante -->
    <path fill="#FBF7F2" stroke="#3A2A2A" stroke-width="8" d="M 204 158 C 216 158 228 166 234 178 C 240 186 240 198 232 200 C 236 208 226 214 220 208 C 216 214 206 212 206 206 Z"/>
    <path fill="#E1D9E8" d="M 232 200 C 236 208 226 214 220 208 C 216 214 208 212 207 204 C 214 206 222 202 228 194 C 232 196 233 198 232 200 Z"/>
    <!-- pseudopodo trasero bajo -->
    <path fill="#FBF7F2" stroke="#3A2A2A" stroke-width="8" d="M 46 160 C 30 158 18 168 16 182 C 14 192 20 196 24 192 C 22 202 34 206 38 198 C 42 192 46 190 52 190 Z"/>
    <path fill="#E1D9E8" d="M 24 192 C 22 202 34 206 38 198 C 42 192 46 190 52 190 L 50 186 C 42 188 34 192 28 188 Z"/>
  </g>
  <g id="cuerpo" stroke-linejoin="round" stroke-linecap="round">
    <!-- masa ancha y pesada con lobulos de pseudopodo en el contorno -->
    <path fill="#FBF7F2" d="M 118 50 C 148 40 176 48 190 70 C 198 82 210 92 212 112 C 214 130 202 138 202 152 C 202 168 218 178 216 198 C 214 218 196 226 176 224 C 158 222 148 228 128 226 C 104 224 92 228 72 222 C 48 216 30 204 34 182 C 36 166 24 156 28 138 C 32 116 46 110 50 96 C 56 70 84 56 118 50 Z"/>
    <!-- sombra (cel shading) a la derecha y abajo -->
    <path fill="#E1D9E8" d="M 190 70 C 198 82 210 92 212 112 C 214 130 202 138 202 152 C 202 168 218 178 216 198 C 214 218 196 226 176 224 C 158 222 148 228 128 226 C 104 224 92 228 72 222 C 48 216 30 204 34 182 C 50 200 78 208 110 208 C 150 208 186 204 192 186 C 196 170 190 160 190 146 C 190 128 200 110 190 70 Z"/>
    <!-- contorno -->
    <path fill="none" stroke="#3A2A2A" stroke-width="8" d="M 118 50 C 148 40 176 48 190 70 C 198 82 210 92 212 112 C 214 130 202 138 202 152 C 202 168 218 178 216 198 C 214 218 196 226 176 224 C 158 222 148 228 128 226 C 104 224 92 228 72 222 C 48 216 30 204 34 182 C 36 166 24 156 28 138 C 32 116 46 110 50 96 C 56 70 84 56 118 50 Z"/>
    <!-- nucleo arrinonado (forma de judia) -->
    <path fill="#7B4FA3" stroke="#3A2A2A" stroke-width="5" d="M 54 166 C 52 144 72 136 86 144 C 94 149 96 158 106 158 C 120 156 126 166 118 180 C 110 196 76 200 62 190 C 56 184 54 176 54 166 Z"/>
    <path fill="#5E3A80" d="M 118 172 C 116 188 96 196 76 192 C 66 190 60 184 58 176 C 72 186 96 188 110 180 C 114 178 116 175 118 172 Z"/>
    <circle cx="84" cy="168" r="4" fill="#5E3A80"/>
    <circle cx="100" cy="176" r="3" fill="#5E3A80"/>
    <circle cx="70" cy="174" r="2.5" fill="#5E3A80"/>
    <ellipse cx="68" cy="154" rx="7" ry="3.5" fill="#A47CC8"/>
    <!-- vacuolas y fagosoma con una bacteria a medio digerir -->
    <circle cx="152" cy="180" r="16" fill="#E1D9E8" stroke="#3A2A2A" stroke-width="3"/>
    <rect x="142" y="174" width="20" height="11" rx="5.5" fill="#9E86F2" stroke="#5435B8" stroke-width="3"/>
    <circle cx="124" cy="202" r="6" fill="#E1D9E8" stroke="#3A2A2A" stroke-width="3"/>
    <circle cx="184" cy="168" r="5" fill="#E1D9E8" stroke="#3A2A2A" stroke-width="3"/>
    <circle cx="58" cy="128" r="7" fill="#E1D9E8" stroke="#3A2A2A" stroke-width="3"/>
    <circle cx="96" cy="124" r="4" fill="#E1D9E8" stroke="#3A2A2A" stroke-width="3"/>
    <!-- receptores PRR: botones en el borde delantero (el motor los hace brillar al detectar un PAMP) -->
    <g id="prr" fill="#A47CC8" stroke="#3A2A2A" stroke-width="5">
      <circle cx="160" cy="48" r="7"/>
      <circle cx="177" cy="56" r="7"/>
      <circle cx="203" cy="88" r="7"/>
      <circle cx="211" cy="124" r="7"/>
    </g>
  </g>
  <g id="ojos" stroke-linejoin="round" stroke-linecap="round">
    <!-- rubor -->
    <ellipse cx="122" cy="124" rx="10" ry="5.5" fill="#E8A29A"/>
    <ellipse cx="202" cy="124" rx="10" ry="5.5" fill="#E8A29A"/>
    <!-- ojo izquierdo: base compartida -->
    <ellipse cx="140" cy="104" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="137" cy="100" r="4.5" fill="#FBF7F2"/>
    <circle cx="143.5" cy="109" r="2" fill="#FBF7F2"/>
    <!-- ojo derecho: base compartida -->
    <ellipse cx="184" cy="104" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="181" cy="100" r="4.5" fill="#FBF7F2"/>
    <circle cx="187.5" cy="109" r="2" fill="#FBF7F2"/>
    <!-- parpados planos y bajos: veterano satisfecho -->
    <path fill="#FBF7F2" d="M 127 88 H 153 V 101 H 127 Z"/>
    <path fill="#FBF7F2" d="M 171 88 H 197 V 101 H 171 Z"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 128 101 H 152 M 172 101 H 196"/>
    <!-- cejas en arco suave, relajadas -->
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 128 82 Q 140 76 152 81 M 172 81 Q 184 76 196 82"/>
    <!-- boca: sonrisa ladeada de satisfecho, lengua relamiendo la comisura -->
    <path fill="#D9737A" stroke="#3A2A2A" stroke-width="3" d="M 178 131 Q 182 142 190 138 Q 194 134 190 128 Z"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 148 130 Q 168 140 190 128"/>
  </g>
</svg>
