<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g id="cuerpo" stroke-linejoin="round" stroke-linecap="round">
    <!-- uropodo: colita trasera de la celula que migra; el cuerpo tapa su union -->
    <path fill="#FBF7F2" stroke="#3A2A2A" stroke-width="8" d="M 100 194 C 84 190 66 194 60 206 C 56 216 68 222 80 218 C 88 216 96 216 106 214 Z"/>
    <path fill="#E1D9E8" d="M 60 208 C 58 216 68 222 80 218 C 88 216 96 216 106 214 L 104 208 C 92 212 72 214 60 208 Z"/>
    <!-- cuerpo: huevo inclinado hacia adelante -->
    <path fill="#FBF7F2" d="M 162.8 82.3 C 200.3 91.6 223.0 130.5 213.3 169.1 C 203.7 207.7 165.5 231.4 128.0 222.0 C 90.5 212.6 67.9 173.8 77.5 135.2 C 87.1 96.6 125.3 72.9 162.8 82.3 Z"/>
