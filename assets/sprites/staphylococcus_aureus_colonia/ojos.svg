    <circle cx="105" cy="136" r="4.5" fill="#FBF7F2"/>
    <circle cx="111.5" cy="145" r="2" fill="#FBF7F2"/>
    <!-- parpados: plano bajo a la izquierda, inclinado a la derecha -->
