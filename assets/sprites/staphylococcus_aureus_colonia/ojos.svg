    <ellipse cx="64" cy="140" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="61" cy="136" r="4.5" fill="#FBF7F2"/>
    <circle cx="67.5" cy="145" r="2" fill="#FBF7F2"/>
