<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g id="brazos" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 14)">
    <!-- goteo izquierdo: brazo de moco que cuelga y termina en gota -->
    <path fill="#CFE39B" stroke="#3A2A2A" stroke-width="8" d="M 70 104 C 46 106 26 120 24 138 C 23 146 18 150 18 160 C 18 172 36 172 35 160 C 35 152 42 146 52 142 C 60 138 66 136 70 134 Z"/>
    <path fill="#A8C46E" d="M 24 160 C 24 166 28 168 30 164 C 30 160 28 154 24 160 Z"/>
    <!-- goteo derecho, mas corto -->
    <path fill="#CFE39B" stroke="#3A2A2A" stroke-width="8" d="M 186 100 C 210 102 230 116 232 134 C 233 142 238 146 238 154 C 238 166 221 166 222 154 C 222 146 216 142 206 138 C 198 134 192 132 188 130 Z"/>
    <path fill="#A8C46E" d="M 226 154 C 226 160 232 160 233 156 C 234 152 230 148 226 154 Z"/>
  </g>
  <g id="cuerpo" stroke-linejoin="round" stroke-linecap="round">
    <!-- masa: cupula caida con charco ancho en la base y punta ladeada -->
    <path fill="#CFE39B" d="M 112 64 C 112 50 124 42 136 46 C 128 52 132 60 140 62 C 176 70 192 100 194 134 C 196 162 214 176 222 194 C 228 212 212 222 192 220 C 172 218 162 226 140 224 C 118 222 104 228 84 222 C 60 216 34 220 34 202 C 34 184 60 170 62 134 C 64 100 84 70 112 64 Z"/>
    <!-- sombra (cel shading): base y lado derecho -->
    <path fill="#A8C46E" d="M 176 82 C 188 98 193 116 194 134 C 196 162 214 176 222 194 C 228 212 212 222 192 220 C 172 218 162 226 140 224 C 118 222 104 228 84 222 C 60 216 34 220 34 202 C 50 208 70 204 90 208 C 112 212 130 206 150 208 C 168 210 180 204 180 188 C 180 160 184 120 176 82 Z"/>
    <!-- nucleo translucido: zona interior mas clara que sugiere transparencia -->
    <path fill="#E2EEBF" d="M 92 150 C 92 132 104 122 116 122 C 106 132 104 146 108 162 C 112 176 126 184 142 182 C 128 192 92 186 92 150 Z"/>
    <!-- burbujas atrapadas -->
    <circle cx="160" cy="176" r="8" fill="#E2EEBF" stroke="#8FAE58" stroke-width="3"/>
    <circle cx="80" cy="196" r="5" fill="#E2EEBF" stroke="#8FAE58" stroke-width="3"/>
    <circle cx="140" cy="198" r="4" fill="#E2EEBF" stroke="#8FAE58" stroke-width="3"/>
    <!-- brillos humedos -->
    <path fill="#EEF4CF" d="M 82 108 C 86 92 98 80 112 76 C 104 86 96 98 92 114 C 90 120 80 118 82 108 Z"/>
    <ellipse cx="96" cy="128" rx="4" ry="5" fill="#EEF4CF"/>
    <ellipse cx="200" cy="196" rx="8" ry="3.5" fill="#CFE39B"/>
    <!-- contorno -->
    <path fill="none" stroke="#3A2A2A" stroke-width="8" d="M 112 64 C 112 50 124 42 136 46 C 128 52 132 60 140 62 C 176 70 192 100 194 134 C 196 162 214 176 222 194 C 228 212 212 222 192 220 C 172 218 162 226 140 224 C 118 222 104 228 84 222 C 60 216 34 220 34 202 C 34 184 60 170 62 134 C 64 100 84 70 112 64 Z"/>
  </g>
  <g id="ojos" stroke-linejoin="round" stroke-linecap="round">
    <!-- rubor -->
    <ellipse cx="88" cy="150" rx="10" ry="5.5" fill="#E8A29A"/>
    <ellipse cx="170" cy="150" rx="10" ry="5.5" fill="#E8A29A"/>
    <!-- ojo izquierdo: base compartida -->
    <ellipse cx="108" cy="132" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="105" cy="128" r="4.5" fill="#FBF7F2"/>
    <circle cx="111.5" cy="137" r="2" fill="#FBF7F2"/>
    <!-- ojo derecho: base compartida -->
    <ellipse cx="152" cy="132" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="149" cy="128" r="4.5" fill="#FBF7F2"/>
    <circle cx="155.5" cy="137" r="2" fill="#FBF7F2"/>
    <!-- parpados caidos: medio cerrados, soñoliento -->
    <path fill="#CFE39B" d="M 95 116 H 121 V 131 Q 108 128 95 133 Z"/>
    <path fill="#CFE39B" d="M 139 116 H 165 V 133 Q 152 128 139 131 Z"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 96 133 Q 108 128 121 131 M 139 131 Q 152 128 164 133"/>
    <!-- cejas relajadas, caidas hacia afuera -->
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 96 112 Q 106 108 118 111 M 142 111 Q 154 108 164 112"/>
    <!-- boca: bostezo pequeño y ovalado -->
    <ellipse cx="130" cy="156" rx="7" ry="9" fill="#8C3A44" stroke="#3A2A2A" stroke-width="5"/>
    <ellipse cx="130" cy="160" rx="3.5" ry="3" fill="#D9737A"/>
  </g>
</svg>
