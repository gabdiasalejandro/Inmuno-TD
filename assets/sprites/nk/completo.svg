<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g id="brazos" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- pua de citoplasma en la coronilla, afilada y ladeada hacia atras -->
    <path fill="#936AA0" stroke="#3A2A2A" stroke-width="8" d="M 150 96 L 176 46 L 128 84 Z"/>
    <path fill="#936AA0" stroke="#3A2A2A" stroke-width="8" d="M 118 88 L 96 40 L 150 84 Z"/>
    <!-- brazo delantero: alzado, sostiene un granulo como arma -->
    <path stroke="#3A2A2A" stroke-width="34" d="M 182 172 Q 214 164 212 132"/>
    <path stroke="#936AA0" stroke-width="18" d="M 182 172 Q 214 164 212 132"/>
    <circle cx="212" cy="120" r="16" fill="#936AA0" stroke="#3A2A2A" stroke-width="8"/>
    <circle cx="212" cy="86" r="15" fill="#B8324A" stroke="#3A2A2A" stroke-width="6"/>
    <circle cx="207" cy="80" r="4" fill="#E57A86" stroke="none"/>
    <path stroke="#3A2A2A" stroke-width="5" d="M 200 108 L 224 108"/>
    <!-- brazo trasero: mano en la cadera -->
    <path stroke="#3A2A2A" stroke-width="34" d="M 76 160 Q 44 170 58 198"/>
    <path stroke="#936AA0" stroke-width="18" d="M 76 160 Q 44 170 58 198"/>
  </g>
  <g id="cuerpo" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="128" cy="152" rx="68" ry="70" fill="#B791BE"/>
    <path fill="#936AA0" d="M 171.7 98.4 A 68 70 0 0 1 116.2 220.9 C 160 204 188 154 171.7 98.4 Z"/>
    <ellipse cx="128" cy="152" rx="68" ry="70" fill="none" stroke="#3A2A2A" stroke-width="8"/>
    <g fill="#B8324A" stroke="#8E2338" stroke-width="3">
      <circle cx="80" cy="170" r="8"/>
      <circle cx="94" cy="200" r="7"/>
      <circle cx="188" cy="130" r="6"/>
      <circle cx="124" cy="214" r="6"/>
      <circle cx="176" cy="204" r="6"/>
      <circle cx="104" cy="212" r="4"/>
    </g>
    <g fill="#E57A86">
      <circle cx="77.5" cy="166.5" r="3"/>
      <circle cx="92" cy="197.5" r="2.5"/>
      <circle cx="186" cy="128" r="2"/>
      <circle cx="122" cy="212" r="2"/>
      <circle cx="174.5" cy="202" r="2"/>
    </g>
    <!-- nucleo redondo oscuro, mas pequeno -->
    <circle cx="158" cy="188" r="16" fill="#3B2260" stroke="#3A2A2A" stroke-width="5"/>
    <path fill="#2A1745" d="M 170 180 A 16 16 0 0 1 153 203 C 166 198 174 190 170 180 Z"/>
    <circle cx="158" cy="188" r="16" fill="none" stroke="#3A2A2A" stroke-width="5"/>
    <ellipse cx="151" cy="181" rx="4" ry="2.5" fill="#6E4C94"/>
  </g>
  <g id="ojos" stroke-linejoin="round" stroke-linecap="round">
    <!-- ojo derecho (visible): parpado inclinado, mirada afilada -->
    <ellipse cx="150" cy="128" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="147" cy="124" r="4.5" fill="#FBF7F2"/>
    <circle cx="153.5" cy="133" r="2" fill="#FBF7F2"/>
    <polygon fill="#B791BE" points="134,108 166,108 166,119 134,127"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="6" d="M 136 127 L 164 118"/>
    <!-- delineado alado: flicks afilados -->
    <path fill="none" stroke="#3A2A2A" stroke-width="6" d="M 164 118 L 180 106 M 162 123 L 178 118"/>
    <!-- ceja alzada en arco -->
    <path fill="none" stroke="#3A2A2A" stroke-width="6" d="M 134 100 Q 152 84 172 96"/>
    <!-- ojo izquierdo, medio oculto por el flequillo -->
    <ellipse cx="104" cy="128" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="101" cy="124" r="4.5" fill="#FBF7F2"/>
    <circle cx="107.5" cy="133" r="2" fill="#FBF7F2"/>
    <polygon fill="#B791BE" points="88,108 120,108 120,127 88,119"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="6" d="M 90 119 L 118 127"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="6" d="M 90 119 L 76 110 M 92 123 L 78 124"/>
    <!-- flequillo afilado sobre el ojo izquierdo -->
    <path fill="#936AA0" stroke="#3A2A2A" stroke-width="5" d="M 92 92 C 108 80 138 82 152 92 C 134 94 116 98 104 112 L 74 122 C 88 112 90 102 92 92 Z"/>
    <!-- sonrisa ladeada con colmillo -->
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 112 150 Q 134 162 158 142"/>
    <polygon fill="#FBF7F2" stroke="#3A2A2A" stroke-width="3" points="140,155 148,153 145,164"/>
  </g>
</svg>
