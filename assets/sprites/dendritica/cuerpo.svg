<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g id="cuerpo" stroke-linejoin="round" stroke-linecap="round">
    <!-- cuerpo redondeado: la cabeza es la celula -->
    <ellipse cx="128" cy="150" rx="62" ry="70" fill="#FBF7F2"/>
    <!-- sombra (cel shading) abajo a la derecha -->
    <path fill="#E1D9E8" d="M 189.1 137.9 A 62 70 0 0 1 74.3 185 Q 120 190 150 170 Q 178 158 189.1 137.9 Z"/>
    <!-- contorno -->
    <ellipse cx="128" cy="150" rx="62" ry="70" fill="none" stroke="#3A2A2A" stroke-width="8"/>
    <!-- nucleo con muesca, pequeno, en la parte baja izquierda -->
    <path fill="#7B4FA3" stroke="#3A2A2A" stroke-width="5" d="M 84 190 Q 82 176 100 176 Q 120 176 124 190 Q 120 204 104 202 Q 100 194 94 196 Q 88 198 84 190 Z"/>
    <path fill="#5E3A80" d="M 122 192 Q 118 202 104 200 Q 102 196 98 195 Q 112 196 118 188 Q 121 188 122 192 Z"/>
    <circle cx="108" cy="190" r="3" fill="#5E3A80"/>
    <ellipse cx="94" cy="183" rx="5" ry="3" fill="#A47CC8"/>
  </g>
</svg>
