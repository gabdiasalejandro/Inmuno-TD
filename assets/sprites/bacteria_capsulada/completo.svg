<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g id="brazos" fill="none" stroke="#3A2A2A" stroke-linejoin="round" stroke-linecap="round" stroke-width="7">
    <!-- patitas cortas bajo la capsula: no se agita, avanza despacio -->
    <path d="M 96 190 L 90 212"/>
    <path d="M 128 194 L 126 216"/>
    <path d="M 160 194 L 162 216"/>
    <path d="M 190 188 L 196 210"/>
  </g>
  <g id="cuerpo" stroke-linejoin="round" stroke-linecap="round">
    <!-- capsula de polisacaridos: un bulto palido que envuelve a la bacteria -->
    <path fill="#F3D3E6" d="M 84 96 H 176 A 50 50 0 0 1 176 196 H 84 A 50 50 0 0 1 84 96 Z"/>
    <!-- sombra de la capsula, abajo -->
    <path fill="#D9A9C6" d="M 214 150 A 50 50 0 0 1 176 196 H 84 A 50 50 0 0 1 40 166 Q 130 186 214 150 Z"/>
    <!-- la bacteria gramnegativa, asomando por detras de la capsula -->
    <rect x="152" y="126" width="62" height="44" rx="22" fill="#E0557A" stroke="#3A2A2A" stroke-width="5"/>
    <!-- brillo de la capsula -->
    <path fill="#FBF7F2" d="M 104 112 Q 130 106 150 110 Q 146 116 108 118 Q 100 117 104 112 Z"/>
    <!-- contorno de la capsula -->
    <path fill="none" stroke="#3A2A2A" stroke-width="8" d="M 84 96 H 176 A 50 50 0 0 1 176 196 H 84 A 50 50 0 0 1 84 96 Z"/>
  </g>
  <g id="ojos" stroke-linejoin="round" stroke-linecap="round">
    <!-- ojo izquierdo (delantero): base compartida -->
    <ellipse cx="96" cy="148" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="93" cy="144" r="4.5" fill="#FBF7F2"/>
    <circle cx="99.5" cy="153" r="2" fill="#FBF7F2"/>
    <!-- ojo derecho: base compartida -->
    <ellipse cx="124" cy="148" rx="10" ry="13" fill="#3A2A2A"/>
    <circle cx="121" cy="144" r="4.5" fill="#FBF7F2"/>
    <circle cx="127.5" cy="153" r="2" fill="#FBF7F2"/>
    <!-- parpados caidos a medias: aire de suficiencia -->
    <path fill="#F3D3E6" d="M 85 134 H 107 V 140 L 85 138 Z"/>
    <path fill="#F3D3E6" d="M 113 134 H 135 V 138 L 113 140 Z"/>
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 86 138 L 106 140 M 114 140 L 134 138"/>
    <!-- cejas alzadas: se cree superior -->
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 84 124 Q 96 116 108 122 M 116 122 Q 128 116 140 124"/>
    <!-- sonrisa de suficiencia -->
    <path fill="none" stroke="#3A2A2A" stroke-width="5" d="M 102 170 Q 118 178 136 168"/>
  </g>
</svg>
